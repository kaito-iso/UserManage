<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{common/layout :: layout(~{::section}, 'メニュー', _)}">

<body>
	<section>
		<div class="container py-5">

			<div class="text-center mb-5">
				<h1 class="display-6 fw-bold text-dark mb-3">ポータルメニュー</h1>
				<div class="d-inline-flex align-items-center gap-2 py-2 px-4 rounded-pill shadow-sm bg-white border">
					<i class="bi bi-calendar-event"></i>
					<span class="text-muted fw-medium" th:text="${today}">yyyy/MM/dd</span>
					<th:block th:if="${holidayName != null}">
						<div class="vr mx-2 text-black-50" style="height: 1.5rem;"></div>
						<span class="badge rounded-pill bg-danger-soft text-danger fw-bold px-3 py-2">
							<span th:text="${holidayName}">祝日</span>
						</span>
					</th:block>
				</div>
			</div>

			<div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-4">

				<div class="col">
					<a th:href="@{/users-view}" sec:authorize="hasRole('ADMIN')"
						class="menu-card card h-100 shadow-sm border-0 text-decoration-none">
						<div class="card-body d-flex flex-column align-items-center">
							<div class="icon-circle bg-primary-soft text-primary mb-3">
								<i class="bi bi-people-fill"></i>
							</div>
							<h6 class="card-title fw-bold">ユーザー一覧</h6>
							<p class="small text-muted mb-0">名簿の参照・編集</p>
						</div>
					</a>

					<div sec:authorize="!hasRole('ADMIN')" class="card h-100 shadow-sm border-0 opacity-50"
						style="cursor: not-allowed;">
						<div class="card-body d-flex flex-column align-items-center">
							<div class="icon-circle bg-secondary-soft text-secondary mb-3">
								<i class="bi bi-lock-fill"></i>
							</div>
							<h6 class="card-title fw-bold text-muted">ユーザー一覧</h6>
							<p class="small text-muted mb-0">管理者のみ閲覧可能</p>
						</div>
					</div>
				</div>

				<div class="col">
					<a th:href="@{/sign-up}" sec:authorize="hasRole('ADMIN')"
						class="menu-card card h-100 shadow-sm border-0 text-decoration-none">
						<div class="card-body d-flex flex-column align-items-center">
							<div class="icon-circle bg-success-soft text-success mb-3">
								<i class="bi bi-person-plus-fill"></i>
							</div>
							<h6 class="card-title fw-bold">新規登録</h6>
							<p class="small text-muted mb-0">アカウント作成</p>
						</div>
					</a>

					<div sec:authorize="!hasRole('ADMIN')" class="card h-100 shadow-sm border-0 opacity-50"
						style="cursor: not-allowed;">
						<div class="card-body d-flex flex-column align-items-center">
							<div class="icon-circle bg-secondary-soft text-secondary mb-3">
								<i class="bi bi-lock-fill"></i>
							</div>
							<h6 class="card-title fw-bold text-muted">新規登録</h6>
							<p class="small text-muted mb-0">管理者のみ実行可能</p>
						</div>
					</div>
				</div>

				<div class="col">
					<a href="#" class="menu-card card h-100 shadow-sm border-0 text-decoration-none">
						<div class="card-body d-flex flex-column align-items-center">
							<div class="icon-circle bg-warning-soft text-warning mb-3">
								<i class="bi bi-clock-history"></i>
							</div>
							<h6 class="card-title fw-bold">タイムカード</h6>
							<p class="small text-muted mb-0">出退勤の打刻</p>
						</div>
					</a>
				</div>

				<div class="col">
					<a th:href="@{/announcements}" class="menu-card card h-100 shadow-sm border-0 text-decoration-none">
						<div class="card-body d-flex flex-column align-items-center">
							<div class="icon-circle bg-info-soft text-info mb-3">
								<i class="bi bi-megaphone-fill"></i>
							</div>
							<h6 class="card-title fw-bold">お知らせ</h6>
							<p class="small text-muted mb-0">社内通知の確認</p>
						</div>
					</a>
				</div>

				<div class="col">
					<a href="#" class="menu-card card h-100 shadow-sm border-0 text-decoration-none">
						<div class="card-body d-flex flex-column align-items-center">
							<div class="icon-circle bg-danger-soft text-danger mb-3">
								<i class="bi bi-receipt"></i>
							</div>
							<h6 class="card-title fw-bold">経費精算</h6>
							<p class="small text-muted mb-0">領収書の提出</p>
						</div>
					</a>
				</div>

				<div class="col">
					<a href="#" class="menu-card card h-100 shadow-sm border-0 text-decoration-none">
						<div class="card-body d-flex flex-column align-items-center">
							<div class="icon-circle bg-secondary-soft text-secondary mb-3">
								<i class="bi bi-calendar3"></i>
							</div>
							<h6 class="card-title fw-bold">カレンダー</h6>
							<p class="small text-muted mb-0">予定の確認</p>
						</div>
					</a>
				</div>

				<div class="col">
					<a href="#" class="menu-card card h-100 shadow-sm border-0 text-decoration-none">
						<div class="card-body d-flex flex-column align-items-center">
							<div class="icon-circle bg-dark-soft text-dark mb-3">
								<i class="bi bi-person-gear"></i>
							</div>
							<h6 class="card-title fw-bold">マイページ</h6>
							<p class="small text-muted mb-0">個人の設定変更</p>
						</div>
					</a>
				</div>

				<div class="col">
					<a th:href="@{/administrator/menu}" class="menu-card card h-100 shadow-sm border-0 text-decoration-none">
						<div class="card-body d-flex flex-column align-items-center">
							<div class="icon-circle bg-purple-soft text-purple mb-3">
								<i class="bi bi-shield-lock-fill"></i>
							</div>
							<h6 class="card-title fw-bold">管理者設定</h6>
							<p class="small text-muted mb-0">権限・ログ管理</p>
						</div>
					</a>
				</div>

			</div>
		</div>

		<style>
			/* カードのデザイン */
			.menu-card {
				transition: transform 0.2s, box-shadow 0.2s;
				border-radius: 15px;
			}

			.menu-card:hover {
				transform: translateY(-5px);
				box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1) !important;
				background-color: #fcfcfc;
			}

			/* アイコン周りの装飾 */
			.icon-circle {
				width: 60px;
				height: 60px;
				display: flex;
				align-items: center;
				justify-content: center;
				border-radius: 50%;
				font-size: 1.8rem;
			}

			/* ソフトカラーの定義（Bootstrap標準にない場合） */
			.bg-primary-soft {
				background-color: #e7f1ff;
			}

			.bg-success-soft {
				background-color: #e6ffed;
			}

			.bg-warning-soft {
				background-color: #fff9e6;
			}

			.bg-info-soft {
				background-color: #e6faff;
			}

			.bg-danger-soft {
				background-color: #ffeef0;
			}

			.bg-secondary-soft {
				background-color: #f8f9fa;
			}

			.bg-dark-soft {
				background-color: #eee;
			}

			.bg-purple-soft {
				background-color: #f3e5f5;
			}

			.text-purple {
				color: #6f42c1;
			}

			.card-title {
				color: #333;
			}
		</style>

		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
	</section>
</body>

</html>

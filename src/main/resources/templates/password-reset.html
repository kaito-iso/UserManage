<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{common/layout :: layout(~{::section}, 'ユーザー情報変更', _)}">

<body>
	<section>
		<div class="container py-5">
			<div class="row justify-content-center">
				<div class="col-lg-7 col-md-9">
					<div class="card border-0 shadow-sm">
						<div class="card-header bg-white py-3 border-bottom">
							<h2 class="h5 mb-0 fw-bold text-dark text-center">ユーザー情報変更</h2>
						</div>
						<div class="card-body p-4 p-md-5">

							<div th:if="${successMessage}" class="alert alert-success border-0 shadow-sm mb-4">
								<i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
							</div>

							<form th:action="@{/password-reset}" th:object="${passwordResetForm}" method="post">

								<div class="mb-4">
									<div class="d-flex align-items-center mb-3">
										<i class="bi bi-shield-lock text-secondary me-2"></i>
										<h3 class="h6 mb-0 fw-bold text-dark">パスワードの変更</h3>
									</div>
									<p class="text-muted small mb-4">セキュリティのため、定期的な変更を推奨します。</p>

									<div class="mb-4">
										<label class="form-label small fw-bold text-secondary">現在のパスワード</label>
										<input type="password" th:field="*{currentPassword}"
											class="form-control form-control-lg bg-light border-0"
											th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'">
										<div class="invalid-feedback" th:errors="*{currentPassword}"></div>
									</div>

									<div class="mb-4">
										<label class="form-label small fw-bold text-secondary">新しいパスワード (6桁～32桁）</label>
										<input type="password" th:field="*{newPassword1}"
											class="form-control form-control-lg bg-light border-0"
											th:classappend="${#fields.hasErrors('newPassword1')} ? 'is-invalid'">
										<div class="invalid-feedback" th:errors="*{newPassword1}"></div>
									</div>

									<div class="mb-4">
										<label class="form-label small fw-bold text-secondary">新しいパスワード（再入力）</label>
										<input type="password" th:field="*{newPassword2}"
											class="form-control form-control-lg bg-light border-0"
											th:classappend="${#fields.hasErrors('newPassword2')} ? 'is-invalid'">
										<div class="invalid-feedback" th:errors="*{newPassword2}"></div>
									</div>
								</div>

								<div class="d-grid gap-2 mt-4">
									<button type="submit" class="btn btn-dark">更　新</button>
									<a th:href="@{/menu}"
										class="btn btn-link text-secondary text-decoration-none btn-sm">戻る</a>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>

</html>
